name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # 1) Backend: compila y corre pruebas con un MySQL temporal
  backend:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: password123
          MYSQL_DATABASE: crud
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -ppassword123"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      SPRING_DATASOURCE_URL: jdbc:mysql://localhost:3306/crud
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: password123
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Compilar y probar backend
        working-directory: backend/crud-application
        run: mvn -B verify

  # 2) Frontend: instala dependencias y construye
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: npm
          cache-dependency-path: frontend/crudfront/package-lock.json
      - name: Instalar y construir frontend
        working-directory: frontend/crudfront
        env:
          CI: "false"
        run: |
          npm ci
          npm run build

  # 3) Docker: construye las imágenes con tus Dockerfile y docker-compose
  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Construir imágenes
        run: docker compose build